name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  Job:
    name: Node.js
    uses: node-modules/github-actions/.github/workflows/node-test.yml@master
    with:
      os: 'ubuntu-latest'
      version: '18, 20, 22, 24, 25'
      install: npm run install-wrk > wrk.log && npm install && cat /proc/cpuinfo
